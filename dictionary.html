<!DOCTYPE html>
<html lang="en" data-theme="light"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>waichapa — Dictionary</title><link rel="icon" href="favicon-32x32.png" type="image/png"><link rel="stylesheet" href="css/style.css">
</head><body>
<div id="app-header"></div>
<main class="container">
  <h1 data-i18n="dict_title">Dictionary &amp; Grammar Database</h1>
  <div class="tabs">
    <button class="tab-btn active" data-tab="dict" data-i18n="tab_dict">Dictionary</button>
    <button class="tab-btn" data-tab="grammar" data-i18n="tab_grammar">Grammar</button>
  </div>
  <section id="tab-dict" class="tab-content active">
    <div class="search-bar">
      <input type="search" id="dictSearch" data-i18n-placeholder="search_placeholder" placeholder="Search word / meaning / tag..." data-i18n-aria-label="a11y_search_dictionary">
      <select id="tagFilter" data-i18n-aria-label="a11y_filter_tag"></select><select id="sortFilter" data-i18n-aria-label="a11y_sort_entries"></select>
    </div>
    <div class="quick-filters" id="quickFilters"></div><div id="dictList" class="word-list" aria-live="polite"></div>
  </section>
  <section id="tab-grammar" class="tab-content">
    <div class="grammar-toolbar">
      <div class="search-bar">
        <input type="search" id="grammarSearch" data-i18n-placeholder="search_placeholder" placeholder="Search grammar..." data-i18n-aria-label="a11y_search_grammar">
        <select id="grammarLevelFilter" data-i18n-aria-label="a11y_filter_level"></select>
      </div>
      <div class="search-suggestions" aria-label="Popular grammar searches">
        <span class="grammar-count" data-i18n="grammar_search_hint">Popular searches</span>
        <button type="button" data-grammar-query="time" data-i18n="grammar_query_time">time</button>
        <button type="button" data-grammar-query="cause" data-i18n="grammar_query_reason">cause</button>
        <button type="button" data-grammar-query="condition" data-i18n="grammar_query_condition">condition</button>
        <button type="button" data-grammar-query="-고 있다">-고 있다</button>
      </div>
      <div class="grammar-tools-row"><p class="grammar-count" id="grammarResultCount" aria-live="polite"></p><button class="text-button" type="button" id="grammarReset" data-i18n="grammar_reset">Reset filters</button></div>
      <div class="tag-cloud" id="grammarTagCloud"></div>
    </div>
    <div id="grammarList" aria-live="polite"></div>
  </section>
</main>
<div id="app-footer"></div>
<script src="js/i18n.js"></script><script src="js/theme.js"></script><script src="js/common.js"></script><script src="js/dictionary-app.js"></script>
<script>
renderHeader('dictionary'); renderFooter();
document.addEventListener('langChanged',()=>{renderHeader('dictionary');renderFooter();renderDict();renderGrammar();});
document.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b===btn));
 document.querySelectorAll('.tab-content').forEach(c=>c.classList.toggle('active',c.id==='tab-'+btn.dataset.tab));
}));
</script></body></html>
